name: Check Meta API (read-only)

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Attribution diagnostics (GET only, numbers only)
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_AD_ACCOUNT_ID: ${{ secrets.META_AD_ACCOUNT_ID }}
        run: |
          python - <<'PY'
          import os, json, requests
          def q(since, until, windows=None, extra=None):
              p = {"level": "campaign", "fields": "campaign_name,actions",
                   "time_range": json.dumps({"since": since, "until": until}),
                   "access_token": os.environ["META_ACCESS_TOKEN"], "limit": 50}
              if windows: p["action_attribution_windows"] = json.dumps(windows)
              if extra: p.update(extra)
              r = requests.get(f"https://graph.facebook.com/v21.0/act_{os.environ['META_AD_ACCOUNT_ID']}/insights", params=p, timeout=60)
              return r.status_code, r.json()
          for label, w, extra in [("default", None, None), ("7d_click", ["7d_click"], None), ("7d_click+1d_view", ["7d_click","1d_view"], None),
                                  ("1d_click", ["1d_click"], None), ("7d_click+1d_view+1d_ev", ["7d_click","1d_view","1d_ev"], None)]:
              st, j = q("2026-10-12", "2026-10-17", w, extra)
              print("##", label, st)
              for x in j.get("data", []):
                  for a in x.get("actions", []):
                      if "purchase" in a["action_type"]:
                          print(x["campaign_name"], a["action_type"], {k: v for k, v in a.items() if k != "action_type"})
          PY
